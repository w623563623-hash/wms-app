<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>云仓储 WMS · 出入库管理后台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css?v=neon3" />
</head>
<body>
  <!-- 登录页 -->
  <div id="login" class="login-wrap">
    <div class="login-card">
      <h2><span class="material-symbols-outlined">inventory_2</span>云仓储 WMS</h2>
      <p>原料 / 成品 出入库管理后台</p>
      <div id="loginMsg"></div>
      <div class="field">
        <label>用户名</label>
        <input id="username" placeholder="如 inout / finance / admin / packer" />
      </div>
      <div class="field">
        <label>密码</label>
        <input id="password" type="password" placeholder="默认密码 Wms@2026" />
      </div>
      <button class="btn btn-primary" style="width:100%" onclick="doLogin()">登录</button>
      <div class="hint">演示账号：admin / inout / packer / finance，密码均为 Wms@2026</div>
    </div>
  </div>

  <!-- 主框架 -->
  <div id="app" class="hidden">
    <div class="topbar">
      <span class="logo">云仓储 WMS</span>
      <span class="env">env: w2026</span>
      <span class="spacer"></span>
      <span class="who" id="who"></span>
      <button class="btn btn-sm" onclick="doLogout()">退出</button>
    </div>
    <div class="layout">
      <div class="sidebar" id="sidebar"></div>
      <div class="content">
        <div class="breadcrumb" id="breadcrumb"></div>
        <h2 class="page-title" id="pageTitle"></h2>
        <div id="view"></div>
      </div>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div class="scanline"></div>
  <script src="./app.js?v=neon3"></script>
</body>
</html>
